name: Windows-CI
permissions:
  contents: read
  pull-requests: read

on: [ pull_request, workflow_dispatch ]

jobs:
  build:
    name: Build
    # The type of runner that the job will run on
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            is-release: 0
          - os: windows-2025
            is-release: 0

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install CMake
        uses: lukka/get-cmake@a89e43e22a96abafcd7a62db652a65ecd33052c9 #v4.4.4

      - name: Build it
        run: script/build.ps1
